# App stack: a Traefik reverse proxy in front of the Node/Express todo app.
#
#   http://localhost:8000/           -> app   (Express, frontend + /items API, ./src + ./Dockerfile)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#
# Traefik discovers routes from each container's `traefik.*` labels through
# the Podman API socket that the Nix dev shell exposes as $DOCKER_SOCK.
# `just up` builds the app image on first run; after editing ./src or the
# Dockerfile run `just rm; just up` to force a clean rebuild
# (podman-compose's `--build` often misses a changed COPY).

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard on :8080 with no auth -- dev only
      - --accesslog=true
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      # sqlite file lives on the named volume below so data survives rebuilds.
      SQLITE_DB_LOCATION: /data/todo.db
    volumes:
      - todo-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.priority=1        # catch-all: lowest priority
      - traefik.http.services.app.loadbalancer.server.port=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/items', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  todo-data:
