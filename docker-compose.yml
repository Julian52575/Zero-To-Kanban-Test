# App stack: a Traefik reverse proxy in front of a split React/Express app.
#
#   http://localhost:8000/           -> frontend (Vite dev server, ./frontend)
#   http://localhost:8000/items      -> backend  (Express API, ./backend)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#
# Traefik discovers routes from each container's `traefik.*` labels through
# the Podman API socket that the Nix dev shell exposes as $DOCKER_SOCK.
# `just up` builds images on first run; after editing ./backend, ./frontend or
# a Dockerfile run `just rm; just up` to force a clean rebuild (podman-compose's
# `--build` often misses a changed COPY).

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard on :8080 with no auth -- dev only
      - --accesslog=true
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo}@db:5432/${POSTGRES_DB:-todo}?schema=public
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/items`)
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/items', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1        # catch-all: lowest priority
      - traefik.http.services.frontend.loadbalancer.server.port=5173
    restart: unless-stopped

volumes:
  todo-db-data:
