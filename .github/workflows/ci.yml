name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/*"
      - ".github/rulesets"
  pull_request:
  workflow_dispatch: # allow a manual re-run from the Actions tab


# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs for the same PR (or branch). Runs on `main` are left
# alone -- we want every push to `main` to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devshell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PODMAN_NO_SOCKET: "1" # don't spawn a Podman API socket in CI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git writes in this job; do not leave the token in .git/config.
          persist-credentials: false

      # Local composite action: check out first, then it installs Nix.
      # `nix flake check` below already evaluates the flake, so skip the warm.
      - uses: ./.github/actions/setup-devshell
        with:
          warm: "false"

      - name: Check the flake evaluates
        run: nix flake check --no-build

      - name: Enter the dev shell and sanity-check tooling
        run: |
          nix develop --command bash -euo pipefail -c '
            just --list
            podman --version
            podman-compose -f docker-compose.yml config >/dev/null
          '

  # Runs alongside `frontend` (no `needs` between them = parallel scheduling).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Start the API and check it responds
        run: |
          npm start &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/items > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not respond on :3000 in time" >&2
          exit 1

  # Runs alongside `backend` (no `needs` between them = parallel scheduling).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Serve the build and check it responds
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend did not respond on :4173 in time" >&2
          exit 1

  # Runs alongside `backend`/`frontend` (no `needs` between them = parallel
  # scheduling). Tests the `db` service from docker-compose.yml as-is --
  # no app code involved, just the container image + healthcheck + connectivity.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Start the db service and wait for its healthcheck
        run: docker compose up -d --wait db

      - name: Check the database accepts connections
        run: docker compose exec -T db pg_isready -U todo -d todo

      - name: Show db logs on failure
        if: failure()
        run: docker compose logs db

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # Single stable check for the branch ruleset to require.
  # Add a job to `needs` here to make it mandatory to the branch ruleset.
  ci-required:
    if: always()
    needs: [devshell, backend, frontend, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        run: |
          if printf '%s\n' '${{ join(needs.*.result, ' ') }}' | grep -Eqw 'failure|cancelled'; then
            echo "a required job did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
