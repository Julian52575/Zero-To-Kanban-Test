name: Convert PR to Draft

on:
  pull_request:
    types:
      [ opened, reopened ]

concurrency:
  # Group by pull request
  group: ${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  convert_to_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Convert To Draft
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) {
              core.info('Pull request is already a draft, nothing to do.');
              return;
            }
            await github.graphql(
              `mutation($id: ID!) {
                convertPullRequestToDraft(input: { pullRequestId: $id }) {
                  pullRequest { isDraft }
                }
              }`,
              { id: pr.node_id }
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: 'This Pull Request was automatically converted to a draft. Please click "Ready For Review" and select reviewers whenever you are done coding.',
            });