name: adr-discussion-sync

# When a GitHub Discussion in the "Architecture Decision Records" category is
# CLOSED:
#
#   * If the decision is not "Accepted", do nothing.
#   * If the `branch` field is empty, comment asking for it and reopen the
#     discussion so it can be closed again once filled in.
#   * If the `branch` field is set, render the discussion (body + comments)
#     into docs/adr/<discussion title>.md and commit it straight to that
#     branch.

on:
  discussion:
    types: [closed]

permissions:
  contents: write # push the ADR document to the target branch
  discussions: write # comment on / reopen the discussion when branch is missing

concurrency:
  group: adr-discussion-sync-${{ github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  sync:
    # Only discussions filed under the ADR category.
    if: github.event.discussion.category.name == 'Architecture Decision Records'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT or GitHub App token is only needed if either
          #   * branch protection blocks the built-in token, or
          #   * the org/repo disables "Allow GitHub Actions to create and
          #     approve pull requests".
          # Falls back to GITHUB_TOKEN when the secret is not set.
          token: ${{ secrets.ADR_SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Parse the ADR form fields
        id: fields
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.discussion.body || '';

            // Discussion forms render each field as "### <Label>\n\n<value>\n\n".
            const field = (label) => {
              const re = new RegExp(
                `### ${label}\\r?\\n\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)`,
              );
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };

            const decision = field('Decision');
            const branch = field('Branch');

            core.setOutput('decision', decision);
            core.setOutput('branch', branch);
            core.info(`decision="${decision}" branch="${branch}"`);

      - name: Ask for the branch and reopen the discussion
        if: steps.fields.outputs.decision == 'Accepted' && steps.fields.outputs.branch == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADR_SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const discussionId = context.payload.discussion.node_id;

            await github.graphql(
              `mutation ($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                  comment { id }
                }
              }`,
              {
                discussionId,
                body: "This discussion cannot be closed yet. Please fill the `branch` field so I can commit the markdown document to it.",
              },
            );

            await github.graphql(
              `mutation ($discussionId: ID!) {
                reopenDiscussion(input: { discussionId: $discussionId }) {
                  discussion { id }
                }
              }`,
              { discussionId },
            );

      - name: Check out the target branch
        if: steps.fields.outputs.decision == 'Accepted' && steps.fields.outputs.branch != ''
        env:
          TARGET_BRANCH: ${{ steps.fields.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Render the discussion into docs/adr
        id: render
        if: steps.fields.outputs.decision == 'Accepted' && steps.fields.outputs.branch != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADR_SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const number = context.payload.discussion.number;

            // ---- pull the whole discussion; comments are paginated ----
            const query = `
              query ($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  discussion(number: $number) {
                    number
                    title
                    url
                    body
                    createdAt
                    category { name }
                    author { login }
                    comments(first: 50, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        body
                        createdAt
                        author { login }
                        replies(first: 100) {
                          nodes { body createdAt author { login } }
                        }
                      }
                    }
                  }
                }
              }`;

            let cursor = null;
            let discussion = null;
            const comments = [];
            do {
              const res = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number,
                cursor,
              });
              discussion = res.repository.discussion;
              comments.push(...discussion.comments.nodes);
              cursor = discussion.comments.pageInfo.hasNextPage
                ? discussion.comments.pageInfo.endCursor
                : null;
            } while (cursor);

            const who = (a) => (a && a.login ? `@${a.login}` : '@ghost');
            const when = (iso) =>
              new Date(iso).toISOString().replace('T', ' ').slice(0, 16) + 'Z';

            // ---- target file: docs/adr/<discussion title>.md ----
            const illegal = /[\/\\?%*:|"<>]/g; // path / FS unsafe characters
            const safeTitle =
              discussion.title
                .trim()
                .replace(illegal, '-')
                .replace(/\s+/g, '-') // no spaces in the filename
                .replace(/-+/g, '-')
                .replace(/^[-.]+/, '')
                .replace(/[-.]+$/, '')
                .slice(0, 200) || `discussion-${number}`;
            const dir = 'docs/adr';
            const file = path.join(dir, `${safeTitle}.md`);
            fs.mkdirSync(dir, { recursive: true });

            const out = [];
            out.push(`# ${discussion.title}`);
            out.push('');
            out.push(`- **Discussion:** [#${discussion.number}](${discussion.url})`);
            out.push(`- **Category:** ${discussion.category.name}`);
            out.push(`- **Original poster:** ${who(discussion.author)}`);
            out.push(`- **Opened:** ${when(discussion.createdAt)}`);
            out.push(`- **Closed:** ${when(new Date().toISOString())}`);
            out.push('');
            out.push('### Discussion');
            out.push('');
            out.push(discussion.body.trim() || '_(empty body)_');
            out.push('');
            out.push('### Poster');
            out.push('');
            out.push(
              `Originally posted by ${who(discussion.author)} on ${when(discussion.createdAt)}.`,
            );
            out.push('---');
            out.push('## Comments');
            out.push('');
            if (comments.length === 0) {
              out.push('_No comments._');
              out.push('');
            } else {
              for (const c of comments) {
                out.push(`#### ${who(c.author)} -- ${when(c.createdAt)}`);
                out.push('');
                out.push(c.body.trim() || '_(empty comment)_');
                out.push('');
                for (const r of c.replies.nodes) {
                  out.push(`> **${who(r.author)}** -- ${when(r.createdAt)}`);
                  out.push('>');
                  for (const line of (r.body.trim() || '_(empty reply)_').split('\n')) {
                    out.push(`> ${line}`);
                  }
                  out.push('');
                }
              }
            }
            out.push('');

            fs.writeFileSync(file, out.join('\n'));

            core.setOutput('file', file);
            core.setOutput('title', discussion.title);

      - name: Commit and push to the target branch
        if: steps.fields.outputs.decision == 'Accepted' && steps.fields.outputs.branch != ''
        env:
          TARGET_BRANCH: ${{ steps.fields.outputs.branch }}
          DOC_TITLE: ${{ steps.render.outputs.title }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: |
          set -euo pipefail
          git add docs/adr
          if git status --porcelain docs/adr | grep -q .; then
            git commit -m "docs(adr): accepted adr \"$DOC_TITLE\" (#$DISCUSSION_NUMBER)"
            git push origin "HEAD:$TARGET_BRANCH"
          else
            echo "Nothing changed -- discussion already in sync."
          fi
