apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-to-kanban.fullname" . }}-backend
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          # DATABASE_URL is assembled at container start so the password
          # never has to pass through a Helm-rendered Secret -- it's read
          # straight from the postgresql Secret (existingSecret in prod,
          # the bitnami-generated one in dev) via DB_PASSWORD below.
          command:
            - sh
            - -c
            - export DATABASE_URL="postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)?schema=public" && npx prisma migrate deploy && node src/index.js
          env:
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: DB_HOST
              value: {{ include "zero-to-kanban.postgresql.host" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.postgresql.secretName" . }}
                  key: {{ include "zero-to-kanban.postgresql.secretKey" . }}
          readinessProbe:
            httpGet:
              path: /items
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /items
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
